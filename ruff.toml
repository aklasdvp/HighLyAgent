# HighLyAgent — pinned lint configuration.
# CI runs `ruff check src tests main.py`; results are deterministic across ruff
# versions because the rule set is explicit instead of relying on ruff's defaults.
line-length = 110
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# tests set env vars before importing src modules (Settings validation at import time)
"tests/*" = ["E402"]
