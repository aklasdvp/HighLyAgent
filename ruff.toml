# HighLyAgent — pinned lint configuration.
# CI runs `ruff check backend/app`; results are deterministic across ruff versions
# because the rule set is explicit instead of relying on ruff's defaults.
line-length = 110
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# tests set env vars before importing app modules (Settings validation at import time)
"backend/tests/*" = ["E402"]
