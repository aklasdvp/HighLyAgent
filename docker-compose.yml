# HighLyAgent — full production stack
#   docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: highlyagent
      POSTGRES_USER: highlyagent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pg/data
    ports: ["5432:5432"]
    restart: unless-stopped                    # always-on: crash or reboot → auto restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highlyagent"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis/data]
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: ./.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: ./.env
    command: celery -A runtime.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: ./.env
    command: celery -A runtime.celery_app beat --loglevel=info
    depends_on: [redis]
    restart: unless-stopped

volumes:
  pg
  redis
