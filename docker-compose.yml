# Local and production service topology: PostgreSQL/pgvector, Redis, API, Celery worker, Celery beat.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: highlyagent
      POSTGRES_USER: highlyagent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    ports: ["5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highlyagent -d highlyagent"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    command: celery -A highlyagent.runtime.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  beat:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    command: celery -A highlyagent.runtime.celery_app beat --loglevel=info
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
