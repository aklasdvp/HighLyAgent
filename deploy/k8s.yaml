# HighLyAgent — Kubernetes manifests (namespace, api, gateway, hpa, ingress)
apiVersion: v1
kind: Namespace
metadata:
  name: highlyagent
---
apiVersion: v1
kind: Secret
metadata:
  name: highlyagent-secrets
  namespace: highlyagent
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://highlyagent:CHANGE_ME@pg:5432/highlyagent"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: highlyagent
  labels: { app: highlyagent, tier: api }
spec:
  replicas: 3
  selector: { matchLabels: { app: highlyagent, tier: api } }
  template:
    metadata:
      labels: { app: highlyagent, tier: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/highlyagent/api:2.4.1
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: highlyagent-secrets } }]
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: highlyagent
spec:
  selector: { app: highlyagent, tier: api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: highlyagent
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: highlyagent
  namespace: highlyagent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"     # long-lived WebSocket
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.highlyagent.io]
      secretName: highlyagent-tls
  rules:
    - host: api.highlyagent.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
